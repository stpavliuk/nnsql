plugins {
    id 'java'
}

def nnsqlToolchainVersion = providers
    .gradleProperty('nnsqlToolchainVersion')
    .map { Integer.parseInt(it) }
    .orElse(25)

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(nnsqlToolchainVersion.get())
    }
}

dependencies {
    implementation project(':translator')

    implementation 'org.postgresql:postgresql:42.7.5'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'com.github.jsqlparser:jsqlparser:5.3'
    implementation 'com.github.jknack:handlebars:4.3.1'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    if (System.getProperty('nnsql.tpch.scaleFactor')) {
        systemProperty 'nnsql.tpch.scaleFactor', System.getProperty('nnsql.tpch.scaleFactor')
    }
    if (System.getProperty('nnsql.tpch.nullRate')) {
        systemProperty 'nnsql.tpch.nullRate', System.getProperty('nnsql.tpch.nullRate')
    }
    if (System.getProperty('nnsql.tpch.queries')) {
        systemProperty 'nnsql.tpch.queries', System.getProperty('nnsql.tpch.queries')
    }
    if (System.getProperty('nnsql.tpch.timingRuns')) {
        systemProperty 'nnsql.tpch.timingRuns', System.getProperty('nnsql.tpch.timingRuns')
    }
    if (System.getProperty('nnsql.tpch.timingWarmupRuns')) {
        systemProperty 'nnsql.tpch.timingWarmupRuns', System.getProperty('nnsql.tpch.timingWarmupRuns')
    }
    if (System.getProperty('nnsql.tpch.queryTimeoutSeconds')) {
        systemProperty 'nnsql.tpch.queryTimeoutSeconds', System.getProperty('nnsql.tpch.queryTimeoutSeconds')
    }
    if (System.getProperty('nnsql.tpch.jdbcUrl')) {
        systemProperty 'nnsql.tpch.jdbcUrl', System.getProperty('nnsql.tpch.jdbcUrl')
    }
    if (System.getProperty('nnsql.tpch.jdbcUser')) {
        systemProperty 'nnsql.tpch.jdbcUser', System.getProperty('nnsql.tpch.jdbcUser')
    }
    if (System.getProperty('nnsql.tpch.jdbcPassword')) {
        systemProperty 'nnsql.tpch.jdbcPassword', System.getProperty('nnsql.tpch.jdbcPassword')
    }
    if (System.getProperty('nnsql.tpch.reportPath')) {
        systemProperty 'nnsql.tpch.reportPath', System.getProperty('nnsql.tpch.reportPath')
    }
}

tasks.named('build') {
    setDependsOn(dependsOn.findAll { dependency ->
        def dependencyName = dependency?.hasProperty('name') ? dependency.name : dependency?.toString()
        dependencyName != 'check'
    })
}

tasks.register('tpchTest') {
    group = 'verification'
    description = 'Runs TPCH integration tests.'
    dependsOn(tasks.named('test'))
}

tasks.register('tpchDebug', JavaExec) {
    group = 'verification'
    description = 'Runs selected TPCH queries and prints source/translated diagnostics.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'nnsql.tpch.framework.TpchQueryDebugger'
    [
        'nnsql.tpch.scaleFactor',
        'nnsql.tpch.nullRate',
        'nnsql.tpch.queries',
        'nnsql.tpch.timingRuns',
        'nnsql.tpch.timingWarmupRuns',
        'nnsql.tpch.queryTimeoutSeconds',
        'nnsql.tpch.jdbcUrl',
        'nnsql.tpch.jdbcUser',
        'nnsql.tpch.jdbcPassword',
        'nnsql.tpch.reportPath'
    ].each { propertyName ->
        if (System.getProperty(propertyName)) {
            systemProperty propertyName, System.getProperty(propertyName)
        }
    }
}
